<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KRONOS QUANT // Confirmação Perfeita (Live WSS)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lightweight-charts/dist/lightweight-charts.standalone.production.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'JetBrains Mono', monospace; background-color: #04101d; color: #fff; margin: 0; padding: 0; overflow: hidden; }
    .header-bar { background-color: #02080f; border-bottom: 2px solid #00f2fe; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: #ffe600; color: #000; padding: 4px 10px; font-weight: bold; border-radius: 4px; font-size: 14px; text-transform: uppercase; }
    .panel { background-color: rgba(10, 20, 35, 0.9); border: 1px solid #1e3a5f; padding: 15px; border-radius: 8px; }
    #chart-container { width: 100vw; height: calc(100vh - 75px); position: relative; }
    .status-pulse { display: inline-block; width: 10px; height: 10px; background-color: #10b981; border-radius: 50%; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
  </style>
</head>
<body>

  <!-- Cabeçalho Principal -->
  <div class="header-bar">
    <div class="flex items-center gap-4">
      <span class="badge">CONFIRMAÇÃO PERFEITA</span>
      <h1 class="text-lg font-bold text-cyan-400">KRONOS AUTÔNOMO <span class="text-white">| LEITURA EM TEMPO REAL</span></h1>
    </div>
    <div class="flex items-center gap-6">
      <div class="flex items-center gap-2">
        <span class="text-slate-400 text-sm">Ativo:</span>
        <select id="symbol" class="bg-slate-800 text-white border border-slate-600 rounded px-2 py-1 outline-none">
          <option value="BTCUSDT" selected>BTC/USDT</option>
          <option value="ETHUSDT">ETH/USDT</option>
          <option value="SOLUSDT">SOL/USDT</option>
        </select>
      </div>
      <div class="flex items-center gap-2">
        <span class="text-slate-400 text-sm">Tempo:</span>
        <select id="timeframe" class="bg-slate-800 text-white border border-slate-600 rounded px-2 py-1 outline-none">
          <option value="5m" selected>5 Minutos</option>
          <option value="15m">15 Minutos</option>
          <option value="1h">1 Hora</option>
        </select>
      </div>
      <div class="text-sm flex items-center gap-2">
        <span class="status-pulse"></span> <span id="ws-status" class="text-emerald-400 font-bold">WSS ONLINE</span>
      </div>
    </div>
  </div>

  <!-- Contentor do Gráfico -->
  <div id="chart-container">
    <!-- Painel Lateral de Informação do Oráculo Flutuante -->
    <div class="absolute top-4 right-16 z-10 w-80 panel shadow-2xl shadow-cyan-900/20">
      <h3 class="text-cyan-400 font-bold text-sm mb-3 border-b border-slate-700 pb-2">DIAGNÓSTICO VETORIAL KRONOS</h3>
      <div class="space-y-2 text-xs text-slate-300">
        <div class="flex justify-between"><span>Preço Atual:</span> <span id="lbl-price" class="text-white font-bold">--</span></div>
        <div class="flex justify-between"><span>Alvo (Target):</span> <span id="lbl-target" class="text-emerald-400 font-bold">--</span></div>
        <div class="flex justify-between"><span>Entrada (Compra):</span> <span id="lbl-entry" class="text-yellow-400 font-bold">--</span></div>
        <div class="flex justify-between"><span>Stop-Loss:</span> <span id="lbl-stop" class="text-red-400 font-bold">--</span></div>
        <div class="mt-3 pt-2 border-t border-slate-700">
          <span class="text-cyan-500 font-bold block mb-1">Ação do Algoritmo:</span>
          <span id="lbl-status" class="text-slate-300">Aguardando dados...</span>
        </div>
      </div>
    </div>
  </div>

  <script>
    // 1. Configuração Estética do Gráfico (Baseado na sua imagem Dark Blue)
    const chartOptions = {
      layout: { background: { type: 'solid', color: '#051c2a' }, textColor: '#d1d5db' },
      grid: { vertLines: { color: 'rgba(255,255,255,0.05)' }, horzLines: { color: 'rgba(255,255,255,0.05)' } },
      crosshair: { mode: LightweightCharts.CrosshairMode.Normal },
      timeScale: { timeVisible: true, borderColor: '#1e3a5f' },
      rightPriceScale: { borderColor: '#1e3a5f' }
    };

    const chart = LightweightCharts.createChart(document.getElementById('chart-container'), chartOptions);

    // 2. Séries de Dados (Velas e Linhas de Anotação)
    const candleSeries = chart.addCandlestickSeries({
      upColor: '#00ff00', downColor: '#ff0000', 
      borderVisible: false, wickUpColor: '#00ff00', wickDownColor: '#ff0000'
    });

    // Resistência Topo (Azul grosso)
    const resistanceLine = chart.addLineSeries({ color: '#0ea5e9', lineWidth: 8 });
    // Suporte Fundo (Azul grosso)
    const supportLine = chart.addLineSeries({ color: '#0ea5e9', lineWidth: 8 });
    
    // Linhas do Canal Descendente
    const channelTop = chart.addLineSeries({ color: '#ffffff', lineWidth: 1 });
    const channelBot = chart.addLineSeries({ color: '#ffffff', lineWidth: 1 });

    // Linhas de Operação (Alvo, Compra, Stop)
    const targetLine = chart.addLineSeries({ color: '#10b981', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed });
    const entryLine = chart.addLineSeries({ color: '#facc15', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed });
    const stopLine = chart.addLineSeries({ color: '#ef4444', lineWidth: 2, lineStyle: LightweightCharts.LineStyle.Dashed });

    let binanceWs = null;
    let klinesData = [];
    let currentSymbol = 'BTCUSDT';
    let currentInterval = '5m';

    // 3. Motor Lógico: Analisar e Desenhar em Tempo Real
    // --- SÉRIES ADICIONAIS PARA O SEU GRÁFICO ---
    // (Adicione estas linhas logo abaixo de onde declarou a targetLine e stopLine)
    const ema5Line = chart.addLineSeries({ color: '#f59e0b', lineWidth: 1, title: 'MME5' }); // Laranja
    const ema20Line = chart.addLineSeries({ color: '#ec4899', lineWidth: 1, title: 'MME20' }); // Rosa

    // --- FUNÇÃO DE COORDENADAS E INTELIGÊNCIA ARTIFICIAL ---
    function analyzeAndDraw(data) {
      if (data.length < 60) return;
      const recent = data.slice(-60);
      const times = recent.map(d => d.time);
      const highs = recent.map(d => d.high);
      const lows = recent.map(d => d.low);
      const closes = recent.map(d => d.close);
      const opens = recent.map(d => d.open);
      
      const lastCandle = recent[recent.length - 1];
      const prevCandle = recent[recent.length - 2];
      const currentPrice = lastCandle.close;

      // 1. CÁLCULO DE MÉDIAS MÓVEIS (MME5 e MME20 das imagens)
      const calculateEMA = (period) => {
        const k = 2 / (period + 1);
        let emaArray = [];
        let ema = closes[0];
        for (let i = 0; i < closes.length; i++) {
          ema = (closes[i] * k) + (ema * (1 - k));
          emaArray.push({ time: times[i], value: ema });
        }
        return emaArray;
      };
      ema5Line.setData(calculateEMA(5));
      ema20Line.setData(calculateEMA(20));

      // 2. MAPEAMENTO DE ESTRUTURA (Suportes e Resistências)
      const highestHigh = Math.max(...highs);
      const lowestLow = Math.min(...lows);
      const highestIndex = highs.indexOf(highestHigh);
      const lowestIndex = lows.indexOf(lowestLow);

      // Coordenadas das Caixas Azuis (Resistência e Suporte)
      resistanceLine.setData([
        { time: times[Math.max(0, highestIndex - 5)], value: highestHigh },
        { time: times[Math.min(times.length - 1, highestIndex + 15)], value: highestHigh }
      ]);
      supportLine.setData([
        { time: times[Math.max(0, lowestIndex - 10)], value: lowestLow },
        { time: times[times.length - 1], value: lowestLow }
      ]);

      // 3. COORDENADAS DE OPERAÇÃO (A Matemática da Fuga)
      // Baseado na altura do canal de baixa
      const structHeight = highestHigh - lowestLow;
      
      // Coordenada de Compra (Amarela): 25% acima do fundo, rompendo a micro-resistência
      const entryPrice = lowestLow + (structHeight * 0.25); 
      // Coordenada de Stop (Vermelha): Abaixo dos múltiplos pavios do fundo
      const stopPrice = lowestLow - (structHeight * 0.05);  
      // Coordenada de Alvo (Verde): Projeção de 2 vezes o risco (Risk/Reward 1:2)
      const targetPrice = entryPrice + ((entryPrice - stopPrice) * 2);        

      targetLine.setData([{ time: times[times.length - 15], value: targetPrice }, { time: times[times.length - 1], value: targetPrice }]);
      entryLine.setData([{ time: times[times.length - 15], value: entryPrice }, { time: times[times.length - 1], value: entryPrice }]);
      stopLine.setData([{ time: times[times.length - 15], value: stopPrice }, { time: times[times.length - 1], value: stopPrice }]);

      // 4. DETEÇÃO DE PADRÕES (Inteligência Visual)
      const markers = [];
      let statusText = "Aguardando setup de reversão...";
      let statusColor = "text-slate-300";

      // Marca a "Forte resistência"
      markers.push({ time: times[highestIndex], position: 'aboveBar', color: '#0ea5e9', shape: 'arrowDown', text: 'Forte resistência' });
      
      // Avalia "Múltiplos pavios" (Pressão compradora no fundo)
      const wickSize = Math.abs(recent[lowestIndex].low - Math.min(recent[lowestIndex].open, recent[lowestIndex].close));
      const bodySize = Math.abs(recent[lowestIndex].open - recent[lowestIndex].close);
      if (wickSize > bodySize * 1.5) {
        markers.push({ time: times[lowestIndex], position: 'belowBar', color: '#fff', shape: 'arrowUp', text: 'Múltiplos pavios distorcendo' });
      }

      // Avalia "Inside Bar" e "Spinning Top"
      const isInsideBar = lastCandle.high < prevCandle.high && lastCandle.low > prevCandle.low;
      const isSpinningTop = Math.abs(lastCandle.open - lastCandle.close) < (lastCandle.high - lastCandle.low) * 0.3; // Corpo pequeno

      if (isInsideBar) {
        markers.push({ time: lastCandle.time, position: 'aboveBar', color: '#facc15', shape: 'circle', text: 'Inside Bar (Dúvida)' });
      } else if (isSpinningTop) {
        markers.push({ time: lastCandle.time, position: 'aboveBar', color: '#a855f7', shape: 'circle', text: 'Spinning Top (Peão)' });
      }

      // Detetar "Forte fuga" e Cruzamento de Médias
      const currentEma5 = ema5Line.data().slice(-1)[0].value;
      const currentEma20 = ema20Line.data().slice(-1)[0].value;
      const isEmaBullish = currentEma5 > currentEma20;

      if (currentPrice > entryPrice && isEmaBullish) {
        markers.push({ time: lastCandle.time, position: 'belowBar', color: '#10b981', shape: 'arrowUp', text: 'Forte fuga + MME5 cruzou MME20' });
        statusText = "ROMPIMENTO CONFIRMADO! Modo Compra Ativado.";
        statusColor = "text-emerald-400 font-bold";
      }

      candleSeries.setMarkers(markers);

      // Atualiza o Painel do Oráculo com as Coordenadas Exatas
      document.getElementById('lbl-price').textContent = currentPrice.toFixed(2);
      document.getElementById('lbl-target').textContent = targetPrice.toFixed(2);
      document.getElementById('lbl-entry').textContent = entryPrice.toFixed(2);
      document.getElementById('lbl-stop').textContent = stopPrice.toFixed(2);
      
      const statusElement = document.getElementById('lbl-status');
      statusElement.innerHTML = `<span class="${statusColor}">${statusText}</span>`;
    }
